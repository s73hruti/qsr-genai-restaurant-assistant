services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      RATE_LIMIT_PER_MIN: "60"
      RATE_LIMIT_LLM_PER_MIN: "20"
  ui:
    build: .
    command: streamlit run src/qsr_assistant/app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    env_file: [.env]
  # Optional vector DB: `docker compose --profile qdrant up`, then set VECTOR_STORE=qdrant and
  # QDRANT_URL=http://qdrant:6333 in .env
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
volumes:
  qdrant_data:
