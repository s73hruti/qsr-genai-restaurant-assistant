[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsr-genai-assistant"
version = "0.3.0"
description = "Tool-calling GenAI assistant: hybrid RAG + ML models as agent tools, with guardrails, evaluation and tracing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "streamlit>=1.50",
]

[project.optional-dependencies]
llm = ["openai>=1.30", "anthropic>=0.40"]
vector = ["faiss-cpu>=1.8", "sentence-transformers>=2.7"]
faiss = ["faiss-cpu>=1.8"]
qdrant = ["qdrant-client>=1.9"]
graph = ["langgraph>=0.2"]
mcp = ["mcp>=1.2,<2"]
finetune = ["sentence-transformers>=2.7", "transformers>=4.44", "datasets>=2.20", "peft>=0.12",
            "trl>=0.12", "bitsandbytes>=0.43", "accelerate>=0.33"]
observability = ["langfuse>=3.0"]
pdf = ["pypdf>=4.0"]
mlops = ["mlflow>=2.12"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
all = ["qsr-genai-assistant[llm,vector,qdrant,graph,mcp,observability,pdf]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qsr_assistant = ["eval/data/*.json", "eval/thresholds.json"]

[project.scripts]
qsr-mcp = "qsr_assistant.mcp_server.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E702"]
