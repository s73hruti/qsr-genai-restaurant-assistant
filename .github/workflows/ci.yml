name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev,llm,graph,mcp,qdrant,faiss]"
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: Evaluation gate (offline backend, fails on regression)
        run: python -m qsr_assistant.eval.evaluate --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: reports/
